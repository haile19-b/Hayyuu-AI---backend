services:
  postgres:
    image: postgres:16-alpine
    container_name: hayyuu_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hayyuu_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: hayyuu_redis
    ports:
      - "6379:6379"
    restart: always

  neo4j:
    image: neo4j:5.18-community
    container_name: hayyuu_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/yourpassword123"
    volumes:
      - neo4j_data:/data
    restart: always

volumes:
  pgdata:
  neo4j_data:
